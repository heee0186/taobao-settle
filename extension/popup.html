<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
body{margin:0;width:300px;font:13px/1.5 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#18202b;background:#fff}
.w{padding:16px}

.mut{color:#8a94a3;font-size:12px}
.err{color:#c2410c}
.box{background:#f5f6f8;border-radius:10px;padding:10px 12px;margin:10px 0}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
